name: Build unsigned IPA

# 在 GitHub 的 macOS 机器上出 ios 包，产物是未签名的 .ipa。
# 未签名包不能直接装，需要用 Sideloadly / AltStore 用你自己的 Apple ID 签一次。
# 详细步骤见 docs/BUILD_IPA.md

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # 只在 App 代码变动时构建 ipa，避免改 CI / 文档也触发一轮
    paths:
      - "BambuSlice/**"
      - "BambuCore/**"
      # 内核的 CMake/源码改动也要触发，否则改了 core 却不出包
      - "core/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
      - ".github/workflows/deps.yml"
  pull_request:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 模拟器版依赖 + libslic3r（给 XCTest 用）
  #
  # 模拟器目标 arm64-apple-ios-simulator 与真机 arm64-apple-ios 不是同一 ABI，
  # 静态库不能混用，所以依赖和 libslic3r 都要单独编一份到 Frameworks-sim/。
  # ─────────────────────────────────────────────────────────────
  core-sim:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 注意：这里每一条都要能失败而不中断 job。
      # GitHub Actions 默认是 bash -e，xcrun 在某些 runner 上会尝试
      # 挂载/下载 SDK 并等待数分钟，一旦失败就直接把 job 打挂。
      - name: 环境信息
        run: |
          echo "架构: $(uname -m)"
          xcodebuild -version || true
          xcodebuild -showsdks 2>/dev/null | grep -i simulator || true
          echo "SDK 探测完成（失败不影响后续）"

      - name: Cache simulator deps
        id: simdeps
        uses: actions/cache@v4
        with:
          path: Frameworks-sim
          key: simdeps-v1-${{ hashFiles('scripts/build_deps_ios.sh', 'scripts/ios.toolchain.cmake') }}

      - name: Build simulator deps
        if: steps.simdeps.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          PLATFORM=simulator bash scripts/build_deps_ios.sh all 2>&1 | tee simdeps.log

      - name: 依赖失败日志
        if: failure()
        run: |
          echo "=== error ==="
          grep -nE "error:|Error [0-9]|cannot find|undefined symbol|No such file" simdeps.log | awk '!seen[$0]++' | head -40 || true
          echo "=== tail ==="
          tail -30 simdeps.log || true

      - name: Cache simulator libslic3r
        id: simlib
        uses: actions/cache@v4
        with:
          path: build-core-sim
          key: libslic3r-sim-v1-${{ hashFiles('core/**', 'scripts/build_deps_ios.sh', 'scripts/ios.toolchain.cmake') }}

      - name: Fetch BambuStudio source
        # 不设 if：libslic3r 缓存命中时也需要 vendor 目录（打包 artifact 用）
        run: |
          curl -L --retry 3 -o bs.tar.gz "https://codeload.github.com/bambulab/BambuStudio/tar.gz/refs/heads/master"
          mkdir -p vendor
          tar -xzf bs.tar.gz -C vendor --strip-components=1

      - name: Build libslic3r (simulator)
        if: steps.simlib.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cmake -S core -B build-core-sim -DCMAKE_TOOLCHAIN_FILE="$PWD/scripts/ios.toolchain.cmake" -DPLATFORM=simulator -DCMAKE_BUILD_TYPE=Release -DBAMBU_SRC="$PWD/vendor" 2>&1 | tee core-sim-cfg.log
          cmake --build build-core-sim -j"$(sysctl -n hw.ncpu)" -- -k 2>&1 | tee core-sim-build.log

      - name: 内核失败日志
        if: failure()
        run: |
          # 注解里只能塞少量行，完整清单推到 ci-log 分支，本地 git fetch 可读
          for f in core-sim-cfg.log core-sim-build.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|CMake Error|fatal error" "$f" \
              | awk '!seen[$0]++' | head -12 \
              | sed "s/^/::error::[$f] /" || true
          done

          mkdir -p ci-log
          {
            echo "# core-sim run #${{ github.run_number }} commit ${{ github.sha }}"
            for f in core-sim-cfg.log core-sim-build.log; do
              [ -f "$f" ] || continue
              echo
              echo "## $f"
              grep -nE "error:|CMake Error|fatal error" "$f" | awk '!seen[$0]++' | head -60 || true
              echo "--- 带上下文 ---"
              grep -A3 -E "error:|fatal error" "$f" | head -80 || true
            done
          } > ci-log/core-sim-failure.txt
          wc -l ci-log/core-sim-failure.txt || true

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log/core-sim-failure.txt
          git commit -m "ci: core-sim 失败日志 #${{ github.run_number }}" || true
          git push -f origin ci-log || true

      # 无条件执行：缓存命中时也要重新组装 + 上传。
      # 这里踩过两个坑：
      #   1) Frameworks-sim 来自 simdeps 缓存，不含 libslic3r.a（那是 build-core-sim 的产物）
      #   2) vendor 目录曾被 if 跳过，导致 tar -C vendor 直接失败且没有可读报错
      # 所以每一步都显式检查并给出 ::error::。
      - name: Pack simulator bundle
        run: |
          set -euo pipefail
          rm -rf bundle-sim && mkdir -p bundle-sim

          test -d Frameworks-sim \
            || { echo "::error::缺 Frameworks-sim（simdeps 缓存未命中）"; exit 1; }
          test -f build-core-sim/libslic3r.a \
            || { echo "::error::缺 build-core-sim/libslic3r.a"; find . -maxdepth 4 -name 'libslic3r.a' | head; exit 1; }
          test -f build-core-sim/libslic3r_version.h \
            || { echo "::error::缺 build-core-sim/libslic3r_version.h"; find . -maxdepth 4 -name 'libslic3r_version.h' | head; exit 1; }
          test -d vendor/src \
            || { echo "::error::缺 vendor/src（源码没下载）"; exit 1; }

          mkdir -p Frameworks-sim/libslic3r/lib Frameworks-sim/libslic3r/include
          cp build-core-sim/libslic3r.a         Frameworks-sim/libslic3r/lib/
          cp build-core-sim/libslic3r_version.h Frameworks-sim/libslic3r/include/

          ls -lh Frameworks-sim/libslic3r/lib/ Frameworks-sim/libslic3r/include/
          tar -czf bundle-sim/frameworks-sim.tgz Frameworks-sim
          tar -czf bundle-sim/vendor-src.tgz -C vendor src
          ls -lh bundle-sim/

      - name: Upload core bundle
        uses: actions/upload-artifact@v4
        with:
          name: core-bundle-sim
          path: bundle-sim
          if-no-files-found: error


  # ── 先编 libslic3r（deps 有缓存，命中时秒过）──────────────
  # .a 几十 MB 不进 git，用 artifact 在同一次 run 里传给 build job
  core:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ★ 内核产物缓存（最重要的一条）
      #   key 只算「会影响内核」的东西：core/ 下的源码与 CMake、依赖脚本、工具链。
      #   只改 BambuCore/** 或 BambuSlice/**（App 层）时 key 不变 → 直接命中，
      #   整个 deps 编译 + libslic3r 编译全部跳过，只做 App 编译和链接。
      #   实测：20 分钟 → 2-3 分钟。
      - name: Cache libslic3r bundle
        id: libcache
        uses: actions/cache@v4
        with:
          path: bundle
          key: libslic3r-bundle-v2-${{ hashFiles('core/**', 'scripts/build_deps_ios.sh', 'scripts/ios.toolchain.cmake') }}

      # ccache 只在「内核真的改了」时有用（能复用未改动文件的 .o）
      # 注意 macOS 上 Homebrew ccache 4.x 的默认目录是 ~/Library/Caches/ccache，
      # 不是 ~/.ccache —— 之前写错路径，缓存一直是空的。
      - name: Cache ccache
        if: steps.libcache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-core-${{ github.sha }}
          restore-keys: ccache-core-

      - name: Install ccache
        if: steps.libcache.outputs.cache-hit != 'true'
        run: brew install ccache

      - name: Cache deps
        if: steps.libcache.outputs.cache-hit != 'true'
        id: depcache
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: iosdeps-all-${{ hashFiles('scripts/build_deps_ios.sh', 'scripts/ios.toolchain.cmake') }}

      - name: Build deps
        if: steps.libcache.outputs.cache-hit != 'true' && steps.depcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/build_deps_ios.sh all 2>&1 | tee deps.log

      - name: Fetch BambuStudio source
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 3 -o bs.tar.gz \
            "https://codeload.github.com/bambulab/BambuStudio/tar.gz/refs/heads/master"
          mkdir -p vendor
          tar -xzf bs.tar.gz -C vendor --strip-components=1

      - name: Build libslic3r
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cmake -S core -B build-core \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/scripts/ios.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBAMBU_SRC="$PWD/vendor" 2>&1 | tee core-cfg.log
          export CCACHE_MAXSIZE=2G
          cmake --build build-core -j"$(sysctl -n hw.ncpu)" -- -k 2>&1 | tee core-build.log
          ccache -s || true

      - name: Show core errors
        if: failure()
        run: |
          for f in core-cfg.log core-build.log deps.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|CMake Error|fatal error" "$f" \
              | awk '!seen[$0]++' | head -9 | sed "s/^/::error::[$f] /" || true
          done

          # 注解锁不到上下文，把完整错误清单推到 ci-log 分支，
          # 这样本地 git fetch 就能读到（含 include 链和 note 行）
          mkdir -p ci-log
          {
            echo "# core run #${{ github.run_number }}  commit ${{ github.sha }}"
            for f in core-cfg.log core-build.log deps.log; do
              [ -f "$f" ] || continue
              echo
              echo "## $f"
              # 只抓 error 本体 + 后两行上下文；note: 会把真正的错误挤掉
              grep -nE "error:|fatal error|CMake Error" "$f" \
                | awk '!seen[$0]++' | head -50 || true
              echo "--- 带上下文 ---"
              grep -A2 -E "error:|fatal error" "$f" | head -60 || true
            done
          } > ci-log/core-failure.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log/core-failure.txt
          git commit -m "core failure log run #${{ github.run_number }}" || exit 0
          git push -f origin ci-log || true

      - name: Arch assert
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          lipo -info build-core/libslic3r.a | grep -q arm64 \
            || { echo "::error::libslic3r.a 不是 arm64"; exit 1; }
          # boost 头完整性断言：b2 --with 模式下 optional.hpp 不会自动装
          test -f Frameworks/boost/include/boost/optional.hpp \
            || { echo "::error::boost 头不全（缺 optional.hpp）"; exit 1; }

      - name: Pack bundle
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          # 关键：把 deps 构建出的整个 Frameworks（boost/tbb/eigen/cgal/...）拷进
          # bundle，再补 libslic3r.a。之前只拷了 libslic3r.a，boost 头全丢了。
          mkdir -p bundle
          cp -R Frameworks bundle/Frameworks
          mkdir -p bundle/Frameworks/libslic3r/lib bundle/Frameworks/libslic3r/include
          cp build-core/libslic3r.a bundle/Frameworks/libslic3r/lib/
          # libslic3r_version.h 是 CMake 生成的，不在源码树里，单独带走
          cp build-core/libslic3r_version.h bundle/Frameworks/libslic3r/include/
          # 打包前自检：boost 头必须已经在包里
          test -f bundle/Frameworks/boost/include/boost/optional.hpp \
            || { echo "::error::bundle 缺 boost/optional.hpp"; exit 1; }
          tar -czf bundle/frameworks.tgz -C bundle Frameworks
          # 头文件包：排除 libigl/eigen（eigen 用 deps 里的）与实现文件
          tar -czf bundle/vendor-headers.tgz \
            --exclude='src/libigl' --exclude='src/eigen' \
            --exclude='*.cpp' --exclude='*.c' --exclude='*.mm' \
            -C vendor src
          ls -lh bundle

      - uses: actions/upload-artifact@v4
        with:
          name: core-bundle
          path: bundle
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 模拟器测试：真实跑一次切片
  #
  # 这就是「让 CI 自己发现问题」的落点：今天那些崩溃
  # （缺 Print::process、get_at(-1) 越界、export_gcode 传 null、
  #   log_memory_info 在 iOS 无实现）都会让这里失败，
  # 不用再走「打包 → 装机 → 手点 → 发崩溃日志」这一圈。
  # ─────────────────────────────────────────────────────────────
  test-sim:
    needs: core-sim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 用 artifact 而不是 cache：
      # 缓存 key 是内容哈希，出现同 key 两条不同体积的条目时 restore 行为不确定
      # （实测出现过 fail-on-cache-miss 明明有 key 却恢复失败）。
      # artifact 是同一次 run 内的确定性传递。
      - name: Fetch simulator core bundle
        uses: actions/download-artifact@v4
        with:
          name: core-bundle-sim
          path: core-bundle-sim

      - name: Unpack
        run: |
          set -eux
          ls -lh core-bundle-sim/
          tar -xzf core-bundle-sim/frameworks-sim.tgz
          mkdir -p BambuCore/third_party
          tar -xzf core-bundle-sim/vendor-src.tgz -C BambuCore/third_party
          mv BambuCore/third_party/src BambuCore/third_party/vendor-src
          echo "--- 内核 ---"
          ls -lh Frameworks-sim/libslic3r/lib/
          ls -lh Frameworks-sim/libslic3r/include/
          lipo -info Frameworks-sim/libslic3r/lib/libslic3r.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run slice tests
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['name'] for v in d['devices'].values() for x in v if x['name'].startswith('iPhone')), ''))")
          if [ -z "$DEV" ]; then
            echo "::error::runner 上没有可用的 iPhone 模拟器"
            xcrun simctl list devices available | head -30
            exit 1
          fi
          echo "==> 使用模拟器: $DEV"
          xcodebuild test \
            -project BambuSlice.xcodeproj \
            -scheme BambuSlice \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEV" \
            FRAMEWORKS_DIR="$PWD/Frameworks-sim" \
            2>&1 | tee test.log

      - name: 失败日志
        if: failure()
        run: |
          echo "=== test.log 错误行 ==="
          grep -nE "error:|failed|XCTAssert|crash|SIGSEGV|SIGABRT|Unable to" test.log | awk '!seen[$0]++' | head -30 | sed 's/^/::error:: /' || true

  build:
    needs: core
    # 用 latest 而不是 macos-14：新版 XcodeGen 生成的工程格式较新，
    # 老镜像自带的 Xcode 会报 "Unable to read project"。
    runs-on: macos-latest
    # 需要写权限才能把失败日志推到 ci-log 分支
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Fetch core bundle
        uses: actions/download-artifact@v4
        with:
          name: core-bundle
          path: core-bundle

      - name: Unpack core bundle
        run: |
          tar -xzf core-bundle/frameworks.tgz
          mkdir -p BambuCore/third_party
          tar -xzf core-bundle/vendor-headers.tgz -C BambuCore/third_party
          mv BambuCore/third_party/src BambuCore/third_party/vendor-src
          echo "--- Frameworks ---"
          ls Frameworks
          echo "--- libslic3r.a ---"
          ls -lh Frameworks/libslic3r/lib/libslic3r.a
          lipo -info Frameworks/libslic3r/lib/libslic3r.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen --version
          if xcodegen generate 2>&1 | tee xcodegen.log; then
            echo "工程生成成功"
          else
            # 把每行错误变成 ::error:: 注解。注解是公开可读的（check-runs API），
            # 这样即使没有 token 也能定位 spec 里哪个字段被拒。
            echo "::error::xcodegen 拒绝了 project.yml，错误摘录："
            grep -v '^[[:space:]]*$' xcodegen.log | head -25 | sed 's/^/::error::/'
            exit 1
          fi

      # 关键：CODE_SIGNING_ALLOWED=NO
      # 我们没有你的证书，跳过签名，产出裸的 .app。
      # Sideloadly 之后会重新签，所以这里不需要任何证书配置。
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BambuSlice.xcodeproj \
            -scheme BambuSlice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      - name: Collect failure log
        if: failure()
        run: |
          mkdir -p ci-log
          {
            echo "# run #${{ github.run_number }}  commit ${{ github.sha }}"
            echo
            echo "## 编译错误（去重，最多 80 条）"
            grep -E '(^|[[:space:]])error:' build.log 2>/dev/null | awk '!seen[$0]++' | head -80 || true
            echo
            echo "## build.log 尾部 40 行"
            tail -40 build.log 2>/dev/null || true
          } > ci-log/failure.txt

          # 顺便输出注解，方便在网页上直接看
          grep -E '(^|[[:space:]])error:' build.log 2>/dev/null \
            | awk '!seen[$0]++' | head -9 | sed 's/^/::error::/' || true

          # 把日志推到 ci-log 分支：git 协议不经过 API 限流，本地 git fetch 就能读。
          # 该分支不触发本 workflow（只在 main 上触发），不会成环。
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log/failure.txt
          git commit -m "ci: failure log for run #${{ github.run_number }}" || exit 0
          git push -f origin ci-log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/BambuSlice.app"
          if [ ! -d "$APP" ]; then
            echo "没找到 .app，实际产物如下："
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload BambuSlice-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BambuSlice-unsigned.ipa Payload
          echo "--- 产物 ---"
          ls -lh BambuSlice-unsigned.ipa
          unzip -l BambuSlice-unsigned.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuSlice-unsigned-ipa
          path: BambuSlice-unsigned.ipa
          retention-days: 30

      # 把 ipa 推到一个孤儿分支，这样没有 token 也能用 git fetch 拿到产物。
      # artifacts 接口需要鉴权，但 git 协议不需要。
      - name: Publish IPA to builds branch
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p dist
          cp BambuSlice-unsigned.ipa dist/BambuSlice-unsigned.ipa
          git add -f dist/BambuSlice-unsigned.ipa
          git commit -m "ipa for run #${{ github.run_number }} (${{ github.sha }})"
          git push -f origin builds
          echo "已推送到 builds 分支"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
