name: Build unsigned IPA

# 在 GitHub 的 macOS 机器上出 ios 包，产物是未签名的 .ipa。
# 未签名包不能直接装，需要用 Sideloadly / AltStore 用你自己的 Apple ID 签一次。
# 详细步骤见 docs/BUILD_IPA.md

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    # 只在 App 代码变动时构建 ipa，避免改 CI / 文档也触发一轮
    paths:
      - "BambuSlice/**"
      - "BambuCore/**"
      # 内核的 CMake/源码改动也要触发，否则改了 core 却不出包
      - "core/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
      - ".github/workflows/deps.yml"
  pull_request:

jobs:
  # ── 先编 libslic3r（deps 有缓存，命中时秒过）──────────────
  # .a 几十 MB 不进 git，用 artifact 在同一次 run 里传给 build job
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ccache：改了 clipper_z 之类的文件时，只有它重编，其余 .o 秒取
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-core-${{ github.sha }}
          restore-keys: ccache-core-

      - name: Install ccache
        run: brew install ccache

      - name: Cache deps
        id: depcache
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: iosdeps-all-${{ hashFiles('scripts/build_deps_ios.sh', 'scripts/ios.toolchain.cmake') }}

      - name: Build deps
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/build_deps_ios.sh all 2>&1 | tee deps.log

      - name: Fetch BambuStudio source
        run: |
          curl -L --retry 3 -o bs.tar.gz \
            "https://codeload.github.com/bambulab/BambuStudio/tar.gz/refs/heads/master"
          mkdir -p vendor
          tar -xzf bs.tar.gz -C vendor --strip-components=1

      - name: Build libslic3r
        run: |
          set -o pipefail
          cmake -S core -B build-core \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/scripts/ios.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBAMBU_SRC="$PWD/vendor" 2>&1 | tee core-cfg.log
          export CCACHE_MAXSIZE=2G
          cmake --build build-core -j"$(sysctl -n hw.ncpu)" -- -k 2>&1 | tee core-build.log
          ccache -s || true

      - name: Show core errors
        if: failure()
        run: |
          for f in core-cfg.log core-build.log deps.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|CMake Error|fatal error" "$f" \
              | awk '!seen[$0]++' | head -9 | sed "s/^/::error::[$f] /" || true
          done

      - name: Arch assert
        run: |
          lipo -info build-core/libslic3r.a | grep -q arm64 \
            || { echo "::error::libslic3r.a 不是 arm64"; exit 1; }
          # boost 头完整性断言：b2 --with 模式下 optional.hpp 不会自动装
          test -f Frameworks/boost/include/boost/optional.hpp \
            || { echo "::error::boost 头不全（缺 optional.hpp）"; exit 1; }

      - name: Pack bundle
        run: |
          # 关键：把 deps 构建出的整个 Frameworks（boost/tbb/eigen/cgal/...）拷进
          # bundle，再补 libslic3r.a。之前只拷了 libslic3r.a，boost 头全丢了。
          mkdir -p bundle
          cp -R Frameworks bundle/Frameworks
          mkdir -p bundle/Frameworks/libslic3r/lib bundle/Frameworks/libslic3r/include
          cp build-core/libslic3r.a bundle/Frameworks/libslic3r/lib/
          # libslic3r_version.h 是 CMake 生成的，不在源码树里，单独带走
          cp build-core/libslic3r_version.h bundle/Frameworks/libslic3r/include/
          # 打包前自检：boost 头必须已经在包里
          test -f bundle/Frameworks/boost/include/boost/optional.hpp \
            || { echo "::error::bundle 缺 boost/optional.hpp"; exit 1; }
          tar -czf bundle/frameworks.tgz -C bundle Frameworks
          # 头文件包：排除 libigl/eigen（eigen 用 deps 里的）与实现文件
          tar -czf bundle/vendor-headers.tgz \
            --exclude='src/libigl' --exclude='src/eigen' \
            --exclude='*.cpp' --exclude='*.c' --exclude='*.mm' \
            -C vendor src
          ls -lh bundle

      - uses: actions/upload-artifact@v4
        with:
          name: core-bundle
          path: bundle
          retention-days: 7

  build:
    needs: core
    # 用 latest 而不是 macos-14：新版 XcodeGen 生成的工程格式较新，
    # 老镜像自带的 Xcode 会报 "Unable to read project"。
    runs-on: macos-latest
    # 需要写权限才能把失败日志推到 ci-log 分支
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Fetch core bundle
        uses: actions/download-artifact@v4
        with:
          name: core-bundle
          path: core-bundle

      - name: Unpack core bundle
        run: |
          tar -xzf core-bundle/frameworks.tgz
          mkdir -p BambuCore/third_party
          tar -xzf core-bundle/vendor-headers.tgz -C BambuCore/third_party
          mv BambuCore/third_party/src BambuCore/third_party/vendor-src
          echo "--- Frameworks ---"
          ls Frameworks
          echo "--- libslic3r.a ---"
          ls -lh Frameworks/libslic3r/lib/libslic3r.a
          lipo -info Frameworks/libslic3r/lib/libslic3r.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen --version
          if xcodegen generate 2>&1 | tee xcodegen.log; then
            echo "工程生成成功"
          else
            # 把每行错误变成 ::error:: 注解。注解是公开可读的（check-runs API），
            # 这样即使没有 token 也能定位 spec 里哪个字段被拒。
            echo "::error::xcodegen 拒绝了 project.yml，错误摘录："
            grep -v '^[[:space:]]*$' xcodegen.log | head -25 | sed 's/^/::error::/'
            exit 1
          fi

      # 关键：CODE_SIGNING_ALLOWED=NO
      # 我们没有你的证书，跳过签名，产出裸的 .app。
      # Sideloadly 之后会重新签，所以这里不需要任何证书配置。
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BambuSlice.xcodeproj \
            -scheme BambuSlice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log

      - name: Collect failure log
        if: failure()
        run: |
          mkdir -p ci-log
          {
            echo "# run #${{ github.run_number }}  commit ${{ github.sha }}"
            echo
            echo "## 编译错误（去重，最多 80 条）"
            grep -E '(^|[[:space:]])error:' build.log 2>/dev/null | awk '!seen[$0]++' | head -80 || true
            echo
            echo "## build.log 尾部 40 行"
            tail -40 build.log 2>/dev/null || true
          } > ci-log/failure.txt

          # 顺便输出注解，方便在网页上直接看
          grep -E '(^|[[:space:]])error:' build.log 2>/dev/null \
            | awk '!seen[$0]++' | head -9 | sed 's/^/::error::/' || true

          # 把日志推到 ci-log 分支：git 协议不经过 API 限流，本地 git fetch 就能读。
          # 该分支不触发本 workflow（只在 main 上触发），不会成环。
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-log/failure.txt
          git commit -m "ci: failure log for run #${{ github.run_number }}" || exit 0
          git push -f origin ci-log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/BambuSlice.app"
          if [ ! -d "$APP" ]; then
            echo "没找到 .app，实际产物如下："
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload BambuSlice-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BambuSlice-unsigned.ipa Payload
          echo "--- 产物 ---"
          ls -lh BambuSlice-unsigned.ipa
          unzip -l BambuSlice-unsigned.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuSlice-unsigned-ipa
          path: BambuSlice-unsigned.ipa
          retention-days: 30

      # 把 ipa 推到一个孤儿分支，这样没有 token 也能用 git fetch 拿到产物。
      # artifacts 接口需要鉴权，但 git 协议不需要。
      - name: Publish IPA to builds branch
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p dist
          cp BambuSlice-unsigned.ipa dist/BambuSlice-unsigned.ipa
          git add -f dist/BambuSlice-unsigned.ipa
          git commit -m "ipa for run #${{ github.run_number }} (${{ github.sha }})"
          git push -f origin builds
          echo "已推送到 builds 分支"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
