name: Runner probe

# 临时诊断用：分别探测 ubuntu 与 macOS runner 能不能拿到。
# 结论出来后可以删掉这个文件。
#   - ubuntu 成功 + macos 失败 → 账号的 macOS runner 不可用（计费/配额/限制）
#   - 两个都失败               → 整个账号的 Actions 有问题（邮箱未验证/被风控/组织策略）
#   - 两个都成功               → 之前那次是偶发或人为取消

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: ubuntu probe
        run: |
          echo "ubuntu runner OK"
          uname -a
          echo "runner name: ${RUNNER_NAME}"
          echo "runner os:   ${RUNNER_OS}"

  macos:
    runs-on: macos-14
    steps:
      - name: macos probe
        run: |
          echo "macos runner OK"
          sw_vers
          xcodebuild -version
          echo "runner name: ${RUNNER_NAME}"
