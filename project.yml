# XcodeGen 工程描述。
# 用法：在仓库根目录执行 `xcodegen generate`，得到 BambuSlice.xcodeproj。
#   安装 xcodegen:  brew install xcodegen
#
# 为什么不用手写 .xcodeproj：pbxproj 是机器生成的二进制式文本，
# 手改容易在合并时炸掉。工程结构交给这个文件，.xcodeproj 作为产物忽略不入库。

name: BambuSlice

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # 静态库与头文件根目录。
    #   真机构建：用默认值（Frameworks/，arm64-apple-ios）
    #   模拟器：  xcodebuild FRAMEWORKS_DIR=$PWD/Frameworks-sim ...
    # 两者 ABI 不同不能混用，所以靠这个变量切换，其余工程配置共用一份。
    FRAMEWORKS_DIR: $(SRCROOT)/Frameworks
    # 注意：SWIFT_VERSION 只接受语言大版本（4.0 / 4.2 / 5.0 / 6.0）。
    # 写 "5.9" 会被 xcodebuild 直接拒绝："SWIFT_VERSION '5.9' is unsupported"。
    SWIFT_VERSION: "5.0"
    # 内核是 C++，跨线程回调多；用 minimal 避免早期被 Actor 隔离检查卡住。
    # 等桥接层稳定后再逐级提到 targeted。
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_C_LANGUAGE_STANDARD: gnu11

targets:

  # ───────────────────────────────────────────────
  # App：纯 SwiftUI + SceneKit
  # ───────────────────────────────────────────────
  BambuSlice:
    type: application
    platform: iOS
    sources:
      - path: BambuSlice
        excludes:
          - "Info.plist"
    dependencies:
      - target: BambuCore
      - sdk: SceneKit.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bambuslice
        PRODUCT_NAME: BambuSlice
        INFOPLIST_FILE: BambuSlice/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: BambuSlice/BambuSlice-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/BambuCore/include
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # 与 libslic3r 的 -ffunction-sections 配合：把没用到的函数整段丢掉。
        # 这样上游 master 新加的「iOS 未移植功能」（STEP 导入、HTTP 日志上传…）
        # 只要没被调用，就不会变成链接错误。
        # 注意：Debug 默认是 NO，这里显式打开。
        DEAD_CODE_STRIPPING: YES
        OTHER_LDFLAGS:
          - $(inherited)
          # 静态库里定义了 ObjC 类（BBSlicer），-ObjC 保证那部分目标文件一定被链接进来，
          # 否则容易出 undefined symbol _OBJC_CLASS_$_BBSlicer
          - -ObjC
          - -lc++
          # libslic3r 及其依赖（真内核）。链接发生在 App target，不在 BambuCore 静态库上。
          - -L$(FRAMEWORKS_DIR)/libslic3r/lib
          - -lslic3r
          - -L$(FRAMEWORKS_DIR)/boost/lib
          - -lboost_filesystem -lboost_thread -lboost_system -lboost_regex
          - -lboost_log -lboost_date_time -lboost_chrono -lboost_atomic
          - -L$(FRAMEWORKS_DIR)/tbb/lib
          - -ltbb -ltbbmalloc
          - -L$(FRAMEWORKS_DIR)/zlib/lib
          - -lz
          - -L$(FRAMEWORKS_DIR)/png/lib
          - -lpng
          - -L$(FRAMEWORKS_DIR)/expat/lib
          - -lexpat

  # ───────────────────────────────────────────────
  # 内核：C++17 + ObjC++，编成静态库
  # ───────────────────────────────────────────────
  BambuCore:
    # 注意：XcodeGen 的类型名是点分写法 library.static，
    # 写成 staticLibrary 会直接报 "Unknown Target type"。
    type: library.static
    platform: iOS
    sources:
      - path: BambuCore/src
      - path: BambuCore/include
    settings:
      base:
        PRODUCT_NAME: BambuCore
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          # 0 = 用内置参考引擎；1 = 链接 libslic3r 真内核
          - BAMBU_CORE_ENABLED=1
        OTHER_CPLUSPLUSFLAGS:
          - $(inherited)
          - -fexceptions
          - -frtti
        # libslic3r 及其内联第三方的头。vendor-src 由 CI 在 ipa 构建时解包，
        # 目录结构与 core/CMakeLists.txt 里的 include 列表一一对应。
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/BambuCore/include
          # openssl/occt 等第三方桩（跟 libslic3r 编译时同一套 shim）
          - $(SRCROOT)/core/shim
          - $(SRCROOT)/BambuCore/third_party/vendor-src
          - $(SRCROOT)/BambuCore/third_party/vendor-src/libslic3r
          - $(SRCROOT)/BambuCore/third_party/vendor-src/admesh
          - $(SRCROOT)/BambuCore/third_party/vendor-src/clipper2/Clipper2Lib/include
          - $(SRCROOT)/BambuCore/third_party/vendor-src/libnest2d/include
          - $(SRCROOT)/BambuCore/third_party/vendor-src/glu-libtess
          - $(SRCROOT)/BambuCore/third_party/vendor-src/glu-libtess/src
          - $(SRCROOT)/BambuCore/third_party/vendor-src/miniz
          - $(SRCROOT)/BambuCore/third_party/vendor-src/qhull/src
          - $(FRAMEWORKS_DIR)/libslic3r/include
          - $(FRAMEWORKS_DIR)/boost/include
          - $(FRAMEWORKS_DIR)/tbb/include
          - $(FRAMEWORKS_DIR)/eigen/include
          - $(FRAMEWORKS_DIR)/cgal/include
          - $(FRAMEWORKS_DIR)/zlib/include
          - $(FRAMEWORKS_DIR)/expat/include
          - $(FRAMEWORKS_DIR)/cereal/include


  # ───────────────────────────────────────────────
  # 单元测试：直接调引擎跑真实切片
  #
  # 为什么用 unit-test 而不是 ui-testing：今天那些崩溃全在 libslic3r 内部，
  # 同进程调用就能复现，不用驱动文件选择器那套 UI 流程，稳定得多。
  # 跑之前需要模拟器版内核：
  #   xcodebuild test ... FRAMEWORKS_DIR=$PWD/Frameworks-sim
  # ───────────────────────────────────────────────
  BambuSliceTests:
    # 类型名同样是点分写法，跟 library.static 一致
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BambuSliceTests
        excludes:
          - "Fixtures/**"
      # .stl 不是已知源码类型，XcodeGen 默认不会放进 Copy Bundle Resources，
      # Bundle(for:) 就找不到。显式声明为资源，测试才拿得到夹具。
      - path: BambuSliceTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: BambuSlice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bambuslice.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES

schemes:
  BambuSlice:
    build:
      targets:
        BambuSlice: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BambuSliceTests
    archive:
      config: Release
